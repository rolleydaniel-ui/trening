.card.cur{border-color:#22c55e}.card.done{opacity:.5}
.anim{position:relative;background:#000;aspect-ratio:3/2}
.anim img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}

.body{padding:10px 14px 14px}h3{margin:0 0 4px;font-size:1.05rem}.meta{color:#fbbf24;margin-bottom:6px}
p{margin:6px 0}.note{color:#9ca3af;font-size:.85rem}a{color:#7dd3fc}

button.reset{margin:24px 0;padding:10px 14px;border-radius:8px;border:1px solid #444;background:none;color:#aaa}

const ids=[0,1,2,3];const jsDay=new Date().getDay();// 1=pn 2=wt 4=czw 5=pt
const map={1:0,2:1,4:2,5:3};
let cur=map[jsDay]!==undefined?map[jsDay]:0;
const key=d=>"trening-"+new Date().toISOString().slice(0,10)+"-"+d;
const load=d=>{try{return JSON.parse(localStorage.getItem(key(d))||"{}")}catch(e){return{}}};
const save=(d,s)=>localStorage.setItem(key(d),JSON.stringify(s));
function render(){
  const day=DAYS[cur],st=load(cur),L=loadLog(cur);
  document.getElementById("tabs").innerHTML=DAYS.map((d,i)=>`<button class="tab ${i===cur?'on':''}" onclick="cur=${i};render();window.scrollTo(0,0)">${d.short.slice(0,3)}</button>`).join("");
  let html=`<h2 style="font-size:1.3rem;color:#fff;margin-top:14px">${day.title}</h2>`;
  let all=[],n=0,done=0,first=null;
  day.sections.forEach((sec,si)=>{
    html+=`<h2>${sec.name}</h2>`;
    sec.items.forEach((it,ii)=>{
      const id=si+"-"+ii;n++;const d=!!st[id];if(d)done++;
      if(!d&&!first){first={id,it,sec:sec.name}}
      html+=`<div class="card ${d?'done':''}" id="c-${id}" data-id="${id}">`+
      (it.img?`<div class="anim"><img src="${it.img[0]}" alt="" loading="lazy"><img class="b" src="${it.img[1]}" alt="" loading="lazy"></div>`:"")+
      `<div class="body"><h3>${it.name}</h3><div class="meta"><b>${it.sets}</b>${it.rest?' · przerwa '+it.rest:''}</div><p>${it.tip}</p>`+
      (it.note?`<p class="note">${it.note}</p>`:"")+
      (it.yt?`<a href="${it.yt}" target="_blank" rel="noopener">▶ Film z techniką (YouTube)</a>`:"")+
      (si===1?logHtml(id,it,L[id]):"")+
      `<label class="chk"><input type="checkbox" ${d?'checked':''} onchange="tick('${id}',this.checked)"> Zrobione</label></div></div>`;
    });
  });
  html+=`<h2>Podsumowanie do wklejenia</h2><textarea class="sum" id="sum" readonly>${summary()}</textarea>`;
  html+=`<button class="reset" onclick="resetDay()">Wyczyść odhaczenia dla tego dnia</button><p class="foot">Ilustracje: free-exercise-db (Unlicense, domena publiczna). Przy bólu (nie zmęczeniu) przerwij ćwiczenie. Plan: tydzień 1-2 zostaw 3-4 powtórzenia w zapasie.</p>`;
  document.getElementById("app").innerHTML=html;
  document.getElementById("pb").style.width=(n?done/n*100:0)+"%";
  const now=document.getElementById("now");
  if(first){now.innerHTML=`<small>Teraz (${first.sec}, ${done}/${n})</small><b>${first.it.name}</b> · ${first.it.sets}`;now.onclick=()=>document.getElementById("c-"+first.id).scrollIntoView({behavior:"smooth",block:"center"});
    const c=document.getElementById("c-"+first.id);if(c)c.classList.add("cur");}
  else{now.innerHTML="<b>Trening zrobiony 💪</b> Napisz Trenerowi „byłem” i podaj ciężary.";now.onclick=null}
}
const loadLog=d=>{try{return JSON.parse(localStorage.getItem("log-"+new Date().toISOString().slice(0,10)+"-"+d)||"{}")}catch(e){return{}}};
const saveLog=(d,s)=>localStorage.setItem("log-"+new Date().toISOString().slice(0,10)+"-"+d,JSON.stringify(s));
const lastAll=()=>{try{return JSON.parse(localStorage.getItem("last-kg")||"{}")}catch(e){return{}}};
function val(id,it,l){const last=lastAll()[it.name]||{};return{sets:(l&&l.sets!=null)?l.sets:it.s0,reps:(l&&l.reps!=null)?l.reps:it.r0,kg:(l&&l.kg!=null)?l.kg:(last.kg!=null?last.kg:0),diff:l&&l.diff||""}}
function logHtml(id,it,l){const v=val(id,it,l);
  const row=(lab,f,disp)=>`<div class="row"><span>${lab}</span><div class="st"><button onclick="bump('${id}','${f}',-1)">−</button><b>${disp}</b><button onclick="bump('${id}','${f}',1)">+</button></div></div>`;
  const dbtn=(k,t)=>`<button class="${v.diff===k?'on':''}" onclick="setDiff('${id}','${k}')">${t}</button>`;
  return `<div class="log">`+row("Serie","sets",v.sets)+row("Powt.","reps",v.reps)+row("Ciężar","kg",v.kg+" kg")+`<div class="diff">${dbtn("lekko","Lekko")}${dbtn("ok","OK")}${dbtn("ciężko","Ciężko")}</div></div>`}
function findItem(id){const [si,ii]=id.split("-").map(Number);return DAYS[cur].sections[si].items[ii]}
function bump(id,f,dir){const it=findItem(id),L=loadLog(cur),v=val(id,it,L[id]);const step=f==="kg"?2.5:1;
  v[f]=Math.max(0,Math.round((v[f]+dir*step)*10)/10);v.t=1;L[id]=v;saveLog(cur,L);remember(it.name,v);keep()}
function setDiff(id,k){const it=findItem(id),L=loadLog(cur),v=val(id,it,L[id]);v.diff=(v.diff===k?"":k);v.t=1;L[id]=v;saveLog(cur,L);remember(it.name,v);keep()}
function remember(name,v){const a=lastAll();a[name]={kg:v.kg};localStorage.setItem("last-kg",JSON.stringify(a))}
function keep(){const y=window.scrollY;render();window.scrollTo(0,y)}
function summary(){const day=DAYS[cur],L=loadLog(cur),st=load(cur);const d=new Date().toLocaleDateString("pl-PL");
  let out=["Byłem: "+day.title+" ("+d+")"];
  day.sections[1].items.forEach((it,ii)=>{const id="1-"+ii,l=L[id];if(!l&&!st[id])return;const v=val(id,it,l);
    out.push(it.name+": "+v.sets+"x"+v.reps+(v.kg?" · "+v.kg+" kg":"")+(v.diff?" · "+v.diff:""))});
  if(out.length===1)out.push("(jeszcze nic nie zapisane)");return out.join("\n")}
function copySum(){const t=summary();const b=document.getElementById("cb");const ok=()=>{b.textContent="Skopiowane ✔";setTimeout(()=>b.textContent="Kopiuj podsumowanie (wklej Trenerowi)",2000)};
  if(navigator.clipboard&&window.isSecureContext){navigator.clipboard.writeText(t).then(ok,()=>fb(t,ok))}else fb(t,ok)}
function fb(t,ok){const a=document.getElementById("sum");a.value=t;a.removeAttribute("readonly");a.select();a.setSelectionRange(0,99999);try{document.execCommand("copy");ok()}catch(e){}a.setAttribute("readonly","")}
function tick(id,v){const s=load(cur);if(v)s[id]=1;else delete s[id];save(cur,s);keep()}
function resetDay(){save(cur,{});saveLog(cur,{});render()}
render();
</script></body></html>
